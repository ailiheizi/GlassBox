
networks:
  # 公网 - Gateway 和 Frontend 暴露
  public:
    driver: bridge
  # 内网 - 所有服务通信
  internal:
    driver: bridge
    internal: true
  # 沙箱隔离网络 - Worker 和沙箱容器
  sandbox-isolated:
    driver: bridge
    # internal: true  # 禁用 internal 以允许端口映射到宿主机

volumes:
  postgres_data:
  redis_data:
  milvus_data:

services:
  # ==================== 基础设施 ====================

  postgres:
    image: postgres:15-alpine
    container_name: newarch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newarch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: newarch-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: newarch-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    networks:
      - internal
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: newarch-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: newarch-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - public
      - internal
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== 核心服务 ====================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: newarch-gateway
    environment:
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - MEMORY_SERVICE_URL=http://memory-service:8082
      - INDEX_SERVICE_URL=http://index-service:8083
      - BROWSER_SERVICE_URL=http://browser-service:8084
      - TASK_SERVICE_URL=http://task-service:8085
      - AI_SERVICE_URL=http://ai-service:8086
      - WORKER_SERVICE_URL=http://worker-manager:9000
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - public
      - internal
    depends_on:
      - auth-service
      - browser-service
      - memory-service
      - index-service
      - task-service
      - ai-service

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: newarch-auth-service
    environment:
      - SERVER_PORT=8081
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/newarch?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-service:
    build:
      context: ./services/browser-service
      dockerfile: Dockerfile
    container_name: newarch-browser-service
    environment:
      - SERVER_PORT=8084
      - AI_SERVICE_URL=http://ai-service:8086
      - MEMORY_SERVICE_URL=http://memory-service:8082
      - INDEX_SERVICE_URL=http://index-service:8083
      - WORKER_SERVICE_URL=http://worker-manager:9000
      - RESPONSE_SIGN_SECRET=${RESPONSE_SIGN_SECRET:-response-sign-secret}
    networks:
      - internal
      - sandbox-isolated
    depends_on:
      - ai-service
      - memory-service

  memory-service:
    build:
      context: ./services/memory-service
      dockerfile: Dockerfile
    container_name: newarch-memory-service
    environment:
      - SERVER_PORT=8082
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/newarch?sslmode=disable
      - MILVUS_ADDRESS=milvus:19530
      - AI_SERVICE_URL=http://ai-service:8086
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ai-service:
        condition: service_started

  index-service:
    build:
      context: ./services/index-service
      dockerfile: Dockerfile
    container_name: newarch-index-service
    environment:
      - SERVER_PORT=8083
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/newarch?sslmode=disable
      - BROWSER_SERVICE_URL=http://browser-service:8084
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      browser-service:
        condition: service_started

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: newarch-ai-service
    environment:
      - SERVER_PORT=8086
      - DOUBAO_API_KEY=${DOUBAO_API_KEY}
      - DOUBAO_API_BASE=${DOUBAO_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-1-8-251228}
      - DOUBAO_GUI_MODEL=${DOUBAO_GUI_MODEL:-doubao-seed-1-8-251228}
      - DOUBAO_VISION_MODEL=${DOUBAO_VISION_MODEL:-doubao-seed-1-8-251228}
      - DOUBAO_EMBEDDING_MODEL=${DOUBAO_EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - WORKER_SERVICE_URL=http://worker-manager:9000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-web:3000}
      - LANGFUSE_EXTERNAL_HOST=${LANGFUSE_EXTERNAL_HOST:-http://localhost:3100}
    volumes:
      - ./services/ai-service/src:/app/src
    networks:
      - internal
      - sandbox-isolated
    depends_on:
      worker-manager:
        condition: service_healthy
      milvus:
        condition: service_healthy

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: newarch-task-service
    environment:
      - SERVER_PORT=8085
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/newarch?sslmode=disable
      - BROWSER_SERVICE_URL=http://browser-service:8084
      - AI_SERVICE_URL=http://ai-service:8086
      - MEMORY_SERVICE_URL=http://memory-service:8082
      - WORKER_SERVICE_URL=http://worker-manager:9000
    networks:
      - internal
      - sandbox-isolated
    depends_on:
      postgres:
        condition: service_healthy
      browser-service:
        condition: service_started

  # ==================== Worker 沙箱管理 ====================

  worker-manager:
    build:
      context: ./services/worker-service
      dockerfile: Dockerfile
    container_name: newarch-worker-manager
    environment:
      - SERVER_PORT=9000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - SANDBOX_SECRET=${SANDBOX_SECRET}
      - SANDBOX_IMAGE=newarch-sandbox:latest
      - SANDBOX_NETWORK=newarch_sandbox-isolated
      - MAX_SANDBOXES=50
      - IDLE_TIMEOUT=30m
      - HOST_ADDRESS=${HOST_ADDRESS:-localhost}
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
      - sandbox-isolated
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 前端 ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newarch-frontend
    ports:
      - "3000:3000"
    networks:
      - public
      - internal
    depends_on:
      - gateway
      - auth-service
      - memory-service
      - index-service
      - browser-service
      - task-service
      - ai-service
