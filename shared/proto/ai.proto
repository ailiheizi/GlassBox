syntax = "proto3";

package ai;

option go_package = "github.com/newarch/shared/proto/ai";

// AI服务
service AIService {
  // 生成Embedding
  rpc GenerateEmbedding(EmbeddingRequest) returns (EmbeddingResponse);

  // 批量生成Embedding
  rpc BatchGenerateEmbedding(BatchEmbeddingRequest) returns (BatchEmbeddingResponse);

  // 聊天 (非流式)
  rpc Chat(ChatRequest) returns (ChatResponse);
}

// Embedding请求
message EmbeddingRequest {
  string text = 1;
  string model = 2; // 可选，默认使用配置的模型
}

// Embedding响应
message EmbeddingResponse {
  repeated float embedding = 1;
  int32 dimensions = 2;
  string model = 3;
}

// 批量Embedding请求
message BatchEmbeddingRequest {
  repeated string texts = 1;
  string model = 2;
}

// 批量Embedding响应
message BatchEmbeddingResponse {
  repeated EmbeddingResult results = 1;
  string model = 2;
}

// 单个Embedding结果
message EmbeddingResult {
  int32 index = 1;
  repeated float embedding = 2;
}

// 聊天消息
message Message {
  string role = 1; // system, user, assistant, tool
  string content = 2;
  string name = 3; // 工具名称 (role=tool时)
  string tool_call_id = 4; // 工具调用ID (role=tool时)
  repeated ToolCall tool_calls = 5; // 工具调用 (role=assistant时)
}

// 工具调用
message ToolCall {
  string id = 1;
  string type = 2; // function
  FunctionCall function = 3;
}

// 函数调用
message FunctionCall {
  string name = 1;
  string arguments = 2; // JSON字符串
}

// 工具定义
message Tool {
  string type = 1; // function
  FunctionDefinition function = 2;
}

// 函数定义
message FunctionDefinition {
  string name = 1;
  string description = 2;
  string parameters = 3; // JSON Schema
}

// 聊天请求
message ChatRequest {
  repeated Message messages = 1;
  repeated Tool tools = 2;
  string tool_choice = 3; // auto, none, required
  string model = 4;
  float temperature = 5;
  int32 max_tokens = 6;
}

// 聊天响应
message ChatResponse {
  string id = 1;
  Message message = 2;
  string finish_reason = 3; // stop, tool_calls, length
  Usage usage = 4;
}

// Token使用统计
message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}
